name: PR Windows Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'cursor/**', 'audit/**']

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows go test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        shell: bash
        run: npm ci || npm install

      - name: Build frontend assets
        working-directory: frontend
        shell: bash
        run: npm run build

      - name: Go vet
        shell: bash
        run: go vet ./...

      - name: Go test
        shell: bash
        run: go test -v ./...
