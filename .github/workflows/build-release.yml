name: Build & Release

on:
  push:
    branches:
      - pulseee/roadmap
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Run Go tests
        run: |
          go test ./...

      - name: Build Wails app
        run: |
          wails build -s -trimpath

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseCore-Windows-x64
          path: build/bin/pulsecore.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (latest-dev)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/pulseee/roadmap' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-dev
          name: "PulseCore Latest Dev Build"
          body: |
            Автоматическая сборка PulseCore из ветки `${{ github.ref_name }}`.
            Коммит: `${{ github.sha }}`.
          prerelease: true
          files: build/bin/pulsecore.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
