name: Build & Release

on:
  push:
    branches:
      - pulseee/roadmap
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binary & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend install

      - name: Run frontend tests
        run: |
          npm --prefix frontend test

      - name: Run Go tests
        run: |
          go test ./...

      - name: Build Wails app
        run: |
          wails build -clean -s -platform windows/amd64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsecore-windows-amd64
          path: build/bin/pulsecore.exe
          if-no-files-found: error

      - name: Publish GitHub Release (latest-dev)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: "PulseCore Latest Dev Build"
          body: |
            Автоматическая сборка PulseCore из ветки `${{ github.ref_name }}`.
            Коммит: `${{ github.sha }}`.
          prerelease: true
          files: build/bin/pulsecore.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
