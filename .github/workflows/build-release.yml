name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag override (e.g. v1.0.1). Empty uses the push tag or a draft timestamp tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: frontend
        shell: bash
        run: npm ci || npm install

      # Embed target for main.go //go:embed; also needed so go test compiles the package.
      - name: Build frontend assets
        working-directory: frontend
        shell: bash
        run: npm run build

      - name: Build embedded sensor helper
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" \
            -o third_party/sensor-helper/pulsecore-sensor-helper.exe ./cmd/sensor-helper

      # Security, hardware-profile, and other unit tests must execute on Windows
      # before packaging. Prefer real go test over compile-only.
      - name: Go test (windows)
        shell: bash
        run: go test -v ./...

      - name: Go vet (windows)
        shell: bash
        run: go vet ./...

      # Do not pack with UPX or other compressors (Defender false positives).
      - name: Guard against packers
        shell: bash
        run: |
          set -euo pipefail
          # This workflow never invokes packers. Fail if any step shells out to one.
          if grep -RInE --exclude-dir=.git \
              '(^|[[:space:]])upx([[:space:]]|$)|enigma.?protector|themida|vmprotect' \
              .github/workflows/*.yml 2>/dev/null \
            | grep -viE 'Guard against packers|never invokes|No packer|refusing|UPX or other|no UPX'; then
            echo "Found packer invocation in workflows; aborting."
            exit 1
          fi
          echo "No packer steps configured."

      - name: Wails build (windows/amd64)
        shell: bash
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Wails embeds build/windows/wails.exe.manifest + info.json into the PE via .syso.
          wails build -clean -platform windows/amd64 -ldflags "-s -w"

      - name: Verify PulseCore.exe
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          for cand in \
            "build/bin/PulseCore.exe" \
            "build/bin/pulsecore.exe" \
            "build/bin/PulseCore-amd64.exe" \
            "build/bin/pulsecore-amd64.exe"; do
            if [[ -f "$cand" ]]; then
              exe="$cand"
              break
            fi
          done
          if [[ -z "$exe" ]]; then
            echo "No Windows exe found under build/bin:"
            ls -la build/bin || true
            exit 1
          fi
          size=$(wc -c < "$exe" | tr -d ' ')
          echo "Found $exe ($size bytes)"
          if [[ "$size" -lt 1000000 ]]; then
            echo "Executable looks empty/too small"
            exit 1
          fi
          mkdir -p dist
          # Canonical release asset name for docs direct-download button.
          cp "$exe" dist/pulsecore.exe
          cp "$exe" dist/PulseCore.exe
          echo "EXE_PATH=dist/pulsecore.exe" >> "$GITHUB_ENV"
          echo "EXE_SIZE=$size" >> "$GITHUB_ENV"

      - name: Verify embedded requireAdministrator manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          data = Path("dist/pulsecore.exe").read_bytes()
          needles = {
              "requireAdministrator": "requireAdministrator".encode("utf-16le"),
              "asInvoker": "asInvoker".encode("utf-16le"),
          }
          # Also check UTF-8 in case the resource was stored that way.
          utf8_req = b"requireAdministrator"
          utf8_as = b"asInvoker"
          has_req = needles["requireAdministrator"] in data or utf8_req in data
          has_as = needles["asInvoker"] in data or utf8_as in data
          print(f"requireAdministrator present: {has_req}")
          print(f"asInvoker present: {has_as}")
          if not has_req:
              raise SystemExit("PE missing requireAdministrator in embedded manifest")
          if has_as and not has_req:
              raise SystemExit("PE still requests asInvoker")
          # Prefer requireAdministrator; asInvoker must not be the execution level.
          # Some toolchains may leave the token in unused strings; require the req token.
          print("Manifest elevation check OK")
          PY

      - name: Optional code sign (signtool)
        shell: bash
        env:
          SIGN_CERT_PFX: ${{ secrets.SIGN_CERT_PFX }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGN_CERT_PFX:-}" ]]; then
            echo "SIGN_CERT_PFX secret absent; skipping signtool."
            exit 0
          fi
          echo "SIGN_CERT_PFX present; attempting Authenticode sign."
          python - <<'PY'
          import base64, os
          raw = os.environ["SIGN_CERT_PFX"]
          # Accept raw base64 or data-URI-ish whitespace.
          blob = base64.b64decode("".join(raw.split()))
          open("sign-cert.pfx", "wb").write(blob)
          print(f"Wrote sign-cert.pfx ({len(blob)} bytes)")
          PY
          SIGNTOOL=""
          for cand in \
            "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe \
            "/c/Program Files/Windows Kits/10/bin/"*/x64/signtool.exe; do
            if [[ -f "$cand" ]]; then
              SIGNTOOL="$cand"
            fi
          done
          if [[ -z "$SIGNTOOL" ]]; then
            SIGNTOOL=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [[ -z "${SIGNTOOL}" || ! -f "$SIGNTOOL" ]]; then
            echo "signtool.exe not found; skipping sign gracefully."
            rm -f sign-cert.pfx
            exit 0
          fi
          PASS_ARGS=()
          if [[ -n "${SIGN_CERT_PASSWORD:-}" ]]; then
            PASS_ARGS=(/p "$SIGN_CERT_PASSWORD")
          fi
          "$SIGNTOOL" sign /fd SHA256 /f sign-cert.pfx "${PASS_ARGS[@]}" /tr http://timestamp.digicert.com /td SHA256 dist/pulsecore.exe
          cp dist/pulsecore.exe dist/PulseCore.exe
          rm -f sign-cert.pfx
          echo "Signed dist/pulsecore.exe"

      - name: Package zip + SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          if [[ -z "$tag" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          zip_name="PulseCore-${tag}-windows-amd64.zip"
          powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/pulsecore.exe' -DestinationPath '${zip_name}' -Force"
          (
            cd dist
            sha256sum pulsecore.exe
          ) | tee dist/pulsecore.exe.sha256
          sha256sum "${zip_name}" | tee "${zip_name}.sha256"
          # Canonical multi-file checksum list for the Release page.
          {
            sha256sum dist/pulsecore.exe | sed 's|dist/||'
            sha256sum "${zip_name}"
          } | tee SHA256SUMS.txt
          echo "ZIP_NAME=${zip_name}" >> "$GITHUB_ENV"

      - name: Build changelog
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## PulseCore ${RELEASE_TAG}"
            echo
            echo "Windows amd64 release build."
            echo
            echo "- Binary: \`pulsecore.exe\` (${EXE_SIZE} bytes) - direct download"
            echo "- Checksums: \`SHA256SUMS.txt\`"
            echo "- Archive: \`${ZIP_NAME}\`"
            echo "- Platform: windows/amd64"
            echo "- Elevation: requireAdministrator (embedded manifest)"
            echo "- Flags: \`wails build -clean -platform windows/amd64 -ldflags \"-s -w\"\` (no UPX)"
            echo
            echo "### Commits"
            if git describe --tags --abbrev=0 >/dev/null 2>&1; then
              prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
              if [[ -n "$prev" && "$prev" != "$RELEASE_TAG" ]]; then
                git log --pretty=format:'- %s (%h)' "${prev}..HEAD"
              else
                git log --pretty=format:'- %s (%h)' -n 20
              fi
            else
              git log --pretty=format:'- %s (%h)' -n 20
            fi
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PulseCore ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}
          files: |
            dist/pulsecore.exe
            dist/pulsecore.exe.sha256
            SHA256SUMS.txt
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
